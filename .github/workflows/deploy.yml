name: Deploy to Lightsail

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 실행

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # 레포지토리 이름 소문자로 변환
            REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_URL="ghcr.io/$REPO_NAME:latest"

            # (선택) 프라이빗 레포일 경우 GHCR 인증 필요
            # echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 최신 이미지 Pull
            docker pull $IMAGE_URL

            # 기존 컨테이너 중지 및 삭제
            docker stop portfolio-main || true
            docker rm portfolio-main || true

            # postgres-db 컨테이너가 사용 중인 네트워크 이름을 자동으로 찾습니다.
            DB_NETWORK=$(docker inspect postgres-db -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' | head -n 1)

            # 호스트에 데이터 저장용 디렉토리 생성 (없으면 생성)
            mkdir -p /home/ubuntu/deploy/data/uploads

            # 새 컨테이너 실행 (호스트의 3000번 포트로 연결)
            # DB와 같은 네트워크에 연결하고, postgres-db 컨테이너를 dev-postgres-host라는 별칭으로 부를 수 있게 연결합니다.
            docker run -d --name portfolio-main -p 3000:8080 --network $DB_NETWORK --link postgres-db:dev-postgres-host --env-file /home/ubuntu/deploy/.env -v /home/ubuntu/deploy/data:/app/data $IMAGE_URL

            # 새 컨테이너 내부에서 DB 마이그레이션 실행
            docker exec portfolio-main npm run db:migrate

            # 새 컨테이너 내부에서 DB 시드 데이터(관리자 계정 등) 주입 실행
            docker exec portfolio-main npm run db:seed

            # 안 쓰는 도커 이미지 정리 (디스크 용량 확보)
            docker image prune -f
